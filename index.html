<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Portfolio</title>

<style>
body{
margin:0;
font-family:Poppins,Arial;
background:linear-gradient(135deg,#4A148C,#880E4F);
color:#fff;
}
header{
text-align:center;
padding:25px;
font-size:26px;
font-weight:bold;
background:rgba(0,0,0,0.35);
}
nav{
background:rgba(255,255,255,0.1);
padding:12px;
display:flex;
justify-content:center;
gap:20px;
}
nav a{
color:#fff;
text-decoration:none;
padding:8px 16px;
border-radius:20px;
}
nav a:hover{
background:rgba(255,255,255,0.3);
}
section{
max-width:900px;
margin:20px auto;
}
.hero,.card{
background:rgba(255,255,255,0.15);
padding:20px;
border-radius:15px;
margin-top:20px;
}
input,textarea,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
}
button{
background:linear-gradient(135deg,#6A1B9A,#D81B60);
color:white;
cursor:pointer;
}
.hidden{display:none}
#auth-box,#signup-box{
max-width:420px;
margin:50px auto;
}
</style>
</head>

<body>

<header>Personal Portfolio Website</header>

<div id="auth-box">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p style="text-align:center">or</p>
<button onclick="showSignup()">Create New Account</button>
</div>

<div id="signup-box" class="hidden">
<h2>Create Account</h2>
<input id="sname" placeholder="Full Name">
<input id="semail" placeholder="Email">
<input id="spassword" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="hideSignup()">Back to Login</button>
</div>

<div id="mainUI" class="hidden">

<nav>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#skills">Skills</a>
<a href="#projects">Projects</a>
<a href="#" onclick="logout()">Logout</a>
</nav>

<section id="home">
<div class="hero">
<h2 id="username"></h2>
<p id="userbio"></p>
</div>
</section>

<section id="about">
<h2>About</h2>
<div class="card">
<textarea id="aboutInput" placeholder="Write about yourself"></textarea>
<button onclick="saveAbout()">Save About</button>
</div>
</section>

<section>
<h2>About (View)</h2>
<div class="card">
<p id="aboutView"></p>
</div>
</section>

<section id="skills">
<h2>Skills</h2>
<div class="card">
<input id="skillInput" placeholder="Add skill">
<button onclick="addSkill()">Add Skill</button>
<ul id="skillList"></ul>
</div>
</section>

<section id="projects">
<h2>Projects</h2>
<div class="card">
<input id="projectTitle" placeholder="Project Title">
<textarea id="projectDesc" placeholder="Project Description"></textarea>
<button onclick="addProject()">Add Project</button>
<div id="projectList"></div>
</div>
</section>

</div>

<script>
window.onload=function(){
let c=JSON.parse(localStorage.getItem("currentUser"));
let r=JSON.parse(localStorage.getItem("rememberUser"));
if(r){
email.value=r.email;
password.value=r.password;
}
if(c){loadUser();}
}

function showSignup(){
authBox(true);
}
function hideSignup(){
authBox(false);
}
function authBox(s){
document.getElementById("auth-box").classList.toggle("hidden",s);
document.getElementById("signup-box").classList.toggle("hidden",!s);
}

function signup(){
let users=JSON.parse(localStorage.getItem("users"))||[];
let user={
name:sname.value,
email:semail.value,
password:spassword.value,
about:"",
skills:[],
projects:[]
};
users.push(user);
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("currentUser",JSON.stringify(user));
localStorage.setItem("rememberUser",JSON.stringify({email:user.email,password:user.password}));
loadUser();
}

function login(){
let users=JSON.parse(localStorage.getItem("users"))||[];
let u=users.find(x=>x.email===email.value && x.password===password.value);
if(!u){alert("Invalid Login");return;}
localStorage.setItem("currentUser",JSON.stringify(u));
localStorage.setItem("rememberUser",JSON.stringify({email:u.email,password:u.password}));
loadUser();
}

function loadUser(){
authBox(true);
document.getElementById("mainUI").classList.remove("hidden");
let u=JSON.parse(localStorage.getItem("currentUser"));
username.innerText=u.name;
userbio.innerText=u.about;
aboutView.innerText=u.about;
showSkills();
showProjects();
}

function saveAbout(){
let u=JSON.parse(localStorage.getItem("currentUser"));
u.about=aboutInput.value;
updateUser(u);
userbio.innerText=u.about;
aboutView.innerText=u.about;
}

function addSkill(){
let u=JSON.parse(localStorage.getItem("currentUser"));
u.skills.push(skillInput.value);
skillInput.value="";
updateUser(u);
showSkills();
}

function showSkills(){
let u=JSON.parse(localStorage.getItem("currentUser"));
skillList.innerHTML="";
u.skills.forEach(s=>skillList.innerHTML+=`<li>${s}</li>`);
}

function addProject(){
let u=JSON.parse(localStorage.getItem("currentUser"));
u.projects.push({title:projectTitle.value,desc:projectDesc.value});
projectTitle.value="";
projectDesc.value="";
updateUser(u);
showProjects();
}

function showProjects(){
let u=JSON.parse(localStorage.getItem("currentUser"));
projectList.innerHTML="";
u.projects.forEach(p=>{
projectList.innerHTML+=`<div class="card"><h3>${p.title}</h3><p>${p.desc}</p></div>`;
});
}

function updateUser(u){
let users=JSON.parse(localStorage.getItem("users"));
let i=users.findIndex(x=>x.email===u.email);
users[i]=u;
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("currentUser",JSON.stringify(u));
}

function logout(){
localStorage.removeItem("currentUser");
location.reload();
}
</script>

</body>
</html>
